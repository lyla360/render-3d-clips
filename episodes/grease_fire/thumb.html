<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #111116;
    font-family: "Roboto", "Droid Sans", "Noto Sans", system-ui, sans-serif;
  }
  .canvas {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
  }
  .panel {
    position: relative;
    width: 1080px;
    height: 960px;
    overflow: hidden;
  }
  .panel img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .panel-top img {
    object-position: 50% 47%;
    transform: scale(1.22);
    transform-origin: 34% 48%;
    filter: contrast(1.06) saturate(1.14);
  }
  .panel-top::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 110px rgba(239, 59, 59, 0.36);
    pointer-events: none;
  }
  .panel-bot img {
    object-position: 50% 64%;
    transform: scale(1.18);
    transform-origin: 48% 58%;
    filter: contrast(1.05) saturate(1.12);
  }
  .panel-bot::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 110px rgba(72, 235, 65, 0.30);
    pointer-events: none;
  }
  .divider {
    position: absolute;
    left: 0;
    top: 952px;
    width: 1080px;
    height: 16px;
    background: #111116;
    z-index: 5;
  }
  .badge-top {
    position: absolute;
    left: 56px;
    top: 96px;
    width: 126px;
    height: 126px;
    z-index: 8;
    filter: drop-shadow(0 8px 0 #111116);
  }
  .badge-bot {
    position: absolute;
    left: 56px;
    top: 1044px;
    width: 122px;
    height: 122px;
    z-index: 8;
    filter: drop-shadow(0 8px 0 #111116);
  }
  .center-pill {
    position: absolute;
    left: 50%;
    top: 960px;
    transform: translate(-50%, -50%);
    z-index: 10;
    background: linear-gradient(180deg, #FFE055 0%, #FFC828 100%);
    border: 9px solid #111116;
    border-radius: 30px;
    padding: 18px 44px;
    box-shadow: 0 14px 0 #111116;
    white-space: nowrap;
  }
  .center-pill span {
    display: block;
    font-size: 74px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -1px;
    color: #111116;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="panel panel-top">
      <img src="../out/prev_v2_01.png" alt="Pitcher pouring water onto grease fire" />
    </div>
    <div class="panel panel-bot">
      <img src="../out/prev_v2_10.png" alt="Sliding chrome metal lid over burning pan to starve oxygen" />
    </div>

    <div class="divider"></div>

    <svg class="badge-top" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="52" fill="#EF3B3B" stroke="#111116" stroke-width="9" />
      <path d="M40 40 L80 80 M80 40 L40 80" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
    </svg>

    <svg class="badge-bot" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="52" fill="#48EB41" stroke="#111116" stroke-width="9" />
      <path d="M36 62 L53 79 L86 42" fill="none" stroke="#111116" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    </svg>

    <div class="center-pill">
      <span>NEVER ADD WATER!</span>
    </div>
  </div>
</body>
</html>
